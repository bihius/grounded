services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: bge-m3
      DB_DATABASE: grounded
      DB_HOST: postgres
      DB_PASSWORD: grounded
      DB_PORT: 5432
      DB_USERNAME: grounded
      SESSION_DRIVER: file
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120
    environment:
      DB_CONNECTION: pgsql
      DB_DATABASE: grounded
      DB_HOST: postgres
      DB_PASSWORD: grounded
      DB_PORT: 5432
      DB_USERNAME: grounded
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: bge-m3
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: grounded
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: grounded
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
